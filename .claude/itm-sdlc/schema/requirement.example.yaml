# schema/requirement.example.yaml
#
# Schema documentation. This shows the SHAPE of a requirement file and the
# quality bar for each field. It is not a domain model, and nothing here
# describes a system anyone is building.
#
# The module is SAMPLE throughout. Real module codes are declared per client
# project and never appear in this repository (CONVENTIONS.md §1).
#
# This file is validated in CI. If it stops passing
# `node scripts/validate-requirements.js schema/requirement.example.yaml`,
# either the schema or this example is wrong.

# ---------------------------------------------------------------------------
# Fully populated: every field the schema allows, including the optional ones.
# ---------------------------------------------------------------------------
- id: REQ-SAMPLE-001
  title: Requesting a record that does not exist is refused, not silently ignored
  module: SAMPLE
  priority: must
  status: verified
  version: 2

  # Specific enough that a reader can go and check it. "The BRD" is not a source;
  # a section, a date or a named conversation is.
  source: Requirements workshop 2026-07-14, item 4; confirmed by client email 2026-07-16

  # WHY the requirement exists, in business terms. Not how it will be built.
  rationale: >-
    A caller must be able to distinguish "this request failed" from "this request
    succeeded and the answer was nothing". Reporting success for a record that was
    never returned pushes the failure downstream, where it resurfaces as missing
    data with no trace of where it was lost.

  # Each criterion must be observable — `then` names something a test can check.
  # "The system behaves correctly" is not a criterion. One behaviour per entry:
  # a `then` joining two independent outcomes with "and" is two requirements.
  acceptance:
    - given: A record with a known identifier exists
      when: It is requested by that identifier
      then: The request succeeds and the response carries that record

    - given: No record with the requested identifier exists
      when: It is requested by that identifier
      then: The request fails as not-found and the response carries no record fields

    - given: A caller holding no authorisation
      when: Any record is requested
      then: >-
        The request fails as unauthorised, and the response does not reveal
        whether a record with that identifier exists

  # Empty because this requirement is past `agreed`. A non-empty list here blocks
  # the draft -> agreed transition (CONVENTIONS.md §6), enforced by the validator.
  ambiguities: []

  # Must name requirements that exist. The graph must be acyclic.
  depends_on:
    - REQ-SAMPLE-002

  # Required once status reaches `verified`: the tests that annotate this
  # requirement at its current version.
  verified_by:
    - tests/sample/record-retrieval.spec.ts

  # Append-only log of superseded versions. The CURRENT version is not listed.
  # Requirements are never rewritten in place; the previous text is retained.
  history:
    - version: 1
      agreed: 2026-07-02
      superseded_by: 2
      summary: >-
        v1 required a successful response carrying an empty result when no record
        matched, on the assumption that an absent record was a normal outcome
        rather than a failure. Superseded once it became clear that callers could
        not distinguish that case from a record that had been returned empty.

# ---------------------------------------------------------------------------
# Deliberately minimal: only the required fields, still at draft with its
# ambiguity register open. This is what a decomposition looks like on day one.
#
# It is also why this file holds two entries rather than one: `depends_on` above
# must resolve to a requirement that exists, or the file does not validate.
# ---------------------------------------------------------------------------
- id: REQ-SAMPLE-002
  title: Every record carries an identifier that is unique within its collection
  module: SAMPLE
  priority: must
  status: draft
  version: 1
  source: Requirements workshop 2026-07-14, item 2
  acceptance:
    - given: A record already exists with a given identifier
      when: A second record is created with that same identifier
      then: The request fails and the existing record is left unchanged

  # Each entry is an OPEN question for the client, phrased as a question.
  # Resolved ambiguities are removed, not marked answered. Nobody may resolve one
  # by choosing a reading — only the client's answer closes it.
  ambiguities:
    - Is the identifier supplied by the caller, or generated by the system?
    - >-
      May an identifier be reused after the record it named is deleted, or is it
      permanently spent?
